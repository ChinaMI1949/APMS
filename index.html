<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人全周期项目管理系统</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#f4f6fa;--surface:#fff;--surface-hover:#eef1f6;--text:#1a1a2e;--text-secondary:#3d3f5e;--text-muted:#7a7a9a;--border:#dce0e8;--primary:#2d4b8c;--primary-light:#e6edf8;--primary-gradient:linear-gradient(135deg,#2d4b8c,#1f3a6b);--shadow:0 6px 24px rgba(0,0,0,0.06);--radius:14px;--radius-sm:8px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
        [data-theme="dark"]{--bg:#14151c;--surface:#1e1f2b;--surface-hover:#2a2b3b;--text:#edf0f7;--text-secondary:#bcc0d0;--text-muted:#7a7f96;--border:#323446;--primary:#6d8fd1;--primary-light:#262d44;--shadow:0 6px 24px rgba(0,0,0,0.4)}
        html{scroll-behavior:smooth}
        body{font-family:var(--font);background:var(--bg);color:var(--text);padding:16px 20px 40px;transition:background .2s,color .2s;min-height:100vh}
        .container{max-width:1100px;margin:0 auto}
        nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);padding:12px 24px;border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:24px;position:sticky;top:12px;z-index:100;backdrop-filter:blur(10px)}
        [data-theme="dark"] nav{background:rgba(30,31,43,0.88)}
        .nav-brand{font-weight:700;font-size:1.2rem;background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .nav-actions{display:flex;gap:8px;flex-wrap:wrap}
        .nav-actions button{background:var(--surface);border:1px solid var(--border);border-radius:30px;padding:6px 16px;font-size:.8rem;font-weight:500;color:var(--text-secondary);cursor:pointer;transition:.15s}
        .nav-actions button:hover{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}
        .sync-status{font-size:.75rem;padding:4px 14px;border-radius:20px;background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7}
        [data-theme="dark"] .sync-status{background:#1a3d2a;color:#81c784;border-color:#2e7d32}
        .sync-status.saving{background:#fff3e0;color:#e65100;border-color:#ffcc80}
        .sync-status.error{background:#ffebee;color:#c62828;border-color:#ef9a9a}
        .sync-status.loading{background:#e3f2fd;color:#1565c0;border-color:#90caf9}
        .stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px;background:var(--surface);padding:16px 20px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:24px;box-shadow:var(--shadow)}
        .stats-bar .stat{text-align:center}
        .stats-bar .stat .num{font-size:1.5rem;font-weight:700;color:var(--primary)}
        .stats-bar .stat .label{font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
        .card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);padding:20px 24px;margin-bottom:20px}
        .card-header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
        .card-header h2{font-size:1.2rem;font-weight:700;display:flex;align-items:center;gap:8px}
        .card-header h2 span{background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .btn{display:inline-flex;align-items:center;gap:6px;background:var(--primary-gradient);color:#fff;border:none;padding:7px 20px;border-radius:30px;font-weight:600;font-size:.85rem;cursor:pointer;transition:.15s;box-shadow:0 4px 12px rgba(45,75,140,0.2)}
        .btn:hover{transform:scale(1.02);box-shadow:0 6px 20px rgba(45,75,140,0.3)}
        .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary);box-shadow:none}
        .btn-outline:hover{background:var(--primary-light)}
        .btn-sm{padding:4px 14px;font-size:.75rem}
        .btn-danger{background:#e74c3c;box-shadow:0 4px 12px rgba(231,76,60,0.2)}
        .btn-danger:hover{background:#c0392b}
        .btn-success{background:#27ae60;box-shadow:0 4px 12px rgba(39,174,96,0.2)}
        .btn-success:hover{background:#1e8449}
        .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 16px;margin-bottom:16px}
        .form-group{display:flex;flex-direction:column;gap:4px}
        .form-group label{font-size:.78rem;font-weight:600;color:var(--text-secondary)}
        .form-group label .required{color:#e74c3c;margin-left:2px}
        .form-group input,.form-group select,.form-group textarea{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;font-size:.88rem;color:var(--text);transition:.15s;font-family:var(--font)}
        .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(45,75,140,0.12)}
        .form-group textarea{resize:vertical;min-height:50px}
        .form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
        .priority-tag{display:inline-block;padding:2px 12px;border-radius:30px;font-size:.7rem;font-weight:700;letter-spacing:.3px}
        .priority-p0{background:#fde8e8;color:#c0392b}
        .priority-p1{background:#fef3e7;color:#d35400}
        .priority-p2{background:#fef9e7;color:#b7950b}
        .priority-p3{background:#eef2f5;color:#5d6d7e}
        [data-theme="dark"] .priority-p0{background:#3d1a1a;color:#f1948a}
        [data-theme="dark"] .priority-p1{background:#3d2a1a;color:#f0b27a}
        [data-theme="dark"] .priority-p2{background:#3d3a1a;color:#f4d03f}
        [data-theme="dark"] .priority-p3{background:#2a2b33;color:#99a3b0}
        .status-tag{display:inline-block;padding:2px 12px;border-radius:30px;font-size:.7rem;font-weight:600}
        .status-planning{background:#eef2f5;color:#5d6d7e}
        .status-active{background:#eaf2f8;color:#2e86c1}
        .status-paused{background:#fef9e7;color:#b7950b}
        .status-completed{background:#e9f7ef;color:#1e8449}
        .status-backlog{background:#eef2f5;color:#5d6d7e}
        .status-todo{background:#eef2f5;color:#5d6d7e}
        .status-doing{background:#eaf2f8;color:#2e86c1}
        .status-review{background:#fef9e7;color:#b7950b}
        .status-done{background:#e9f7ef;color:#1e8449}
        .status-blocked{background:#fde8e8;color:#c0392b}
        [data-theme="dark"] .status-planning{background:#2a2b33;color:#99a3b0}
        [data-theme="dark"] .status-active{background:#1a2a3d;color:#5dade2}
        [data-theme="dark"] .status-paused{background:#3d3a1a;color:#f4d03f}
        [data-theme="dark"] .status-completed{background:#1a3d2a;color:#58d68d}
        [data-theme="dark"] .status-backlog{background:#2a2b33;color:#99a3b0}
        [data-theme="dark"] .status-todo{background:#2a2b33;color:#99a3b0}
        [data-theme="dark"] .status-doing{background:#1a2a3d;color:#5dade2}
        [data-theme="dark"] .status-review{background:#3d3a1a;color:#f4d03f}
        [data-theme="dark"] .status-done{background:#1a3d2a;color:#58d68d}
        [data-theme="dark"] .status-blocked{background:#3d1a1a;color:#f1948a}
        .task-item{border-bottom:1px solid var(--border);padding:14px 0;transition:.1s}
        .task-item:last-child{border-bottom:none}
        .task-item:hover{background:var(--surface-hover);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:var(--radius-sm)}
        .task-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
        .task-row .task-name{font-weight:600;flex:1 1 160px;font-size:.95rem}
        .task-row .task-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.78rem;color:var(--text-secondary)}
        .task-row .task-actions{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
        .task-children{margin-left:28px;border-left:2px solid var(--border);padding-left:16px;margin-top:8px}
        .task-sub-toggle{cursor:pointer;user-select:none;color:var(--text-muted);font-size:.75rem;background:none;border:none;padding:2px 8px;border-radius:20px}
        .task-sub-toggle:hover{background:var(--surface-hover)}
        .empty-state{text-align:center;padding:30px 10px;color:var(--text-muted);font-size:.9rem}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:999;padding:20px}
        .modal-overlay.active{display:flex}
        .modal{background:var(--surface);border-radius:var(--radius);max-width:600px;width:100%;max-height:85vh;overflow-y:auto;padding:28px 32px;border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,0.2)}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
        .modal-header h3{font-size:1.2rem}
        .modal-close{background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--text-muted)}
        .modal-close:hover{color:var(--text)}
        .save-hint{background:#e3f2fd;border:1px solid #90caf9;border-radius:8px;padding:10px 16px;margin-bottom:16px;font-size:.85rem;color:#1565c0}
        [data-theme="dark"] .save-hint{background:#1a2a3d;border-color:#2e7d32;color:#81c784}
        @media(max-width:640px){body{padding:10px 12px 30px}.card{padding:14px 16px}.form-grid{grid-template-columns:1fr}nav{flex-direction:column;align-items:stretch;gap:8px}.nav-actions{justify-content:center}.task-row{flex-direction:column;align-items:stretch}.task-row .task-actions{margin-left:0}.task-children{margin-left:12px;padding-left:10px}.stats-bar{grid-template-columns:repeat(2,1fr)}}
        @media print{body{background:#fff;padding:.2in}.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}nav,.btn,.task-actions,.modal-overlay{display:none!important}.task-item:hover{background:none;margin:0;padding:14px 0}.stats-bar{border:1px solid #ccc;background:#f8f9fa}}
        ::-webkit-scrollbar{width:6px;height:6px}
        ::-webkit-scrollbar-track{background:var(--bg)}
        ::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
        ::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}
        .collapse-enter{max-height:0;opacity:0;overflow:hidden;transition:max-height .25s ease,opacity .2s ease}
        .collapse-enter.active{max-height:3000px;opacity:1}
    </style>
</head>
<body>
<div class="container" id="app">
    <nav>
        <div class="nav-brand">📋 全周期项目事务管理</div>
        <div class="nav-actions">
            <span id="syncStatus" class="sync-status loading">🔄 加载中...</span>
            <button onclick="syncToGitHub()" class="btn btn-sm btn-github" style="background:#24292e;color:#fff;border:none;padding:4px 14px;border-radius:30px;cursor:pointer;">☁️ 同步到GitHub</button>
            <button onclick="switchTheme()">🌓 主题</button>
            <button onclick="window.print()">🖨️ 打印</button>
            <button onclick="openTokenModal()">⚙️ 配置</button>
        </div>
    </nav>
    <div class="stats-bar" id="statsBar"></div>
    <div class="card">
        <div class="card-header"><h2><span>📁 项目总库</span></h2><button class="btn" onclick="openProjectModal()">+ 新建项目</button></div>
        <div id="projectList"></div>
    </div>
    <div class="card">
        <div class="card-header">
            <h2><span>📌 全局任务总库</span></h2>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn btn-sm" onclick="openTaskModal()">+ 新建任务</button>
                <select id="viewFilter" onchange="renderAll()" style="background:var(--bg);border:1px solid var(--border);border-radius:30px;padding:4px 14px;font-size:.78rem;color:var(--text);">
                    <option value="all">📊 全部</option>
                    <option value="p0">🔴 P0</option>
                    <option value="p1">🟠 P1</option>
                    <option value="p2">🟡 P2</option>
                    <option value="p3">🔵 P3</option>
                    <option value="backlog">⏳ Backlog</option>
                    <option value="todo">📋 To Do</option>
                    <option value="doing">🔄 Doing</option>
                    <option value="review">🔍 Review</option>
                    <option value="done">✅ Done</option>
                    <option value="archived">📦 已归档</option>
                </select>
            </div>
        </div>
        <div id="taskList"></div>
    </div>
    <!-- 项目弹窗 -->
    <div class="modal-overlay" id="projectModal">
        <div class="modal">
            <div class="modal-header"><h3 id="projectModalTitle">新建项目</h3><button class="modal-close" onclick="closeModal('projectModal')">&times;</button></div>
            <div class="save-hint">💡 所有带 <span style="color:#e74c3c;">*</span> 的字段均为必填。</div>
            <form id="projectForm" onsubmit="saveProject(event)">
                <input type="hidden" id="projectEditId">
                <div class="form-grid">
                    <div class="form-group"><label>项目名称 <span class="required">*</span></label><input id="pName" required></div>
                    <div class="form-group"><label>优先级 <span class="required">*</span></label><select id="pPriority" required><option value="P0">P0 最高</option><option value="P1">P1 重要</option><option value="P2" selected>P2 常规</option><option value="P3">P3 次要</option></select></div>
                    <div class="form-group"><label>开始时间 <span class="required">*</span></label><input id="pStart" type="datetime-local" required></div>
                    <div class="form-group"><label>截止时间 <span class="required">*</span></label><input id="pEnd" type="datetime-local" required></div>
                    <div class="form-group"><label>执行场地 <span class="required">*</span></label><input id="pLocation" required placeholder="如：学校实验室"></div>
                    <div class="form-group"><label>状态 <span class="required">*</span></label><select id="pStatus" required><option value="planning">Planning</option><option value="active" selected>Active</option><option value="paused">Paused</option><option value="completed">Completed</option></select></div>
                    <div class="form-group" style="grid-column:1/-1;"><label>整体验收标准 <span class="required">*</span></label><textarea id="pStandard" required placeholder="如：论文查重率<15%+答辩通过"></textarea></div>
                </div>
                <div class="form-actions"><button type="submit" class="btn">保存</button><button type="button" class="btn btn-outline" onclick="closeModal('projectModal')">取消</button></div>
            </form>
        </div>
    </div>
    <!-- 任务弹窗 -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal">
            <div class="modal-header"><h3 id="taskModalTitle">新建任务</h3><button class="modal-close" onclick="closeModal('taskModal')">&times;</button></div>
            <div class="save-hint">💡 所有带 <span style="color:#e74c3c;">*</span> 的字段均为必填。</div>
            <form id="taskForm" onsubmit="saveTask(event)">
                <input type="hidden" id="taskEditId">
                <div class="form-grid">
                    <div class="form-group" style="grid-column:1/-1;"><label>任务名称 <span class="required">*</span></label><input id="tName" required></div>
                    <div class="form-group"><label>所属项目</label><select id="tProjects" multiple style="min-height:60px;"></select><small style="color:var(--text-muted);font-size:.7rem;">按住 Ctrl/Cmd 多选</small></div>
                    <div class="form-group"><label>父级任务</label><select id="tParent"><option value="">无</option></select></div>
                    <div class="form-group"><label>前置任务</label><select id="tPrev"><option value="">无</option></select></div>
                    <div class="form-group"><label>优先级 <span class="required">*</span></label><select id="tPriority" required><option value="P0">P0 最高</option><option value="P1">P1 重要</option><option value="P2" selected>P2 常规</option><option value="P3">P3 次要</option></select></div>
                    <div class="form-group"><label>开始时间 <span class="required">*</span></label><input id="tStart" type="datetime-local" required></div>
                    <div class="form-group"><label>截止时间 <span class="required">*</span></label><input id="tEnd" type="datetime-local" required></div>
                    <div class="form-group"><label>执行场地 <span class="required">*</span></label><input id="tLocation" required placeholder="如：图书馆、线上"></div>
                    <div class="form-group"><label>流转状态 <span class="required">*</span></label><select id="tStatus" required><option value="backlog">Backlog</option><option value="todo">To Do</option><option value="doing" selected>Doing</option><option value="review">Review</option><option value="done">Done</option></select></div>
                    <div class="form-group" style="grid-column:1/-1;"><label>验收指标 <span class="required">*</span></label><textarea id="tAccept" required placeholder="硬性验收标准"></textarea></div>
                    <div class="form-group" style="grid-column:1/-1;"><label>备注</label><textarea id="tNote" placeholder="额外说明、场地准入限制等"></textarea></div>
                </div>
                <div class="form-actions"><button type="submit" class="btn">保存</button><button type="button" class="btn btn-outline" onclick="closeModal('taskModal')">取消</button></div>
            </form>
        </div>
    </div>
    <!-- 配置弹窗 -->
    <div class="modal-overlay" id="tokenModal">
        <div class="modal">
            <div class="modal-header"><h3>⚙️ 配置 GitHub 同步</h3><button class="modal-close" onclick="closeModal('tokenModal')">&times;</button></div>
            <div class="save-hint">📌 数据存储在 GitHub Issues 中，完全不依赖外部网站。<br>需要 <strong>repo</strong> 权限。</div>
            <form onsubmit="saveConfig(event)">
                <div class="form-group"><label>GitHub Token</label><input id="tokenInput" type="password" placeholder="ghp_xxxxxxxxxxxx" style="width:100%;"></div>
                <div class="form-group" style="margin-top:12px;"><label>仓库地址</label><input id="repoInput" placeholder="用户名/仓库名 (如: jiahao-dong/pms-system)" style="width:100%;"></div>
                <div class="form-actions" style="margin-top:16px;"><button type="submit" class="btn">保存</button><button type="button" class="btn btn-outline" onclick="closeModal('tokenModal')">取消</button></div>
            </form>
        </div>
    </div>
</div>
<script>
// ============================================================
//  GitHub Issues 存储引擎
//  数据存储在 Issue #1 的 body 中
// ============================================================
const STORAGE_ISSUE_NUMBER = 1;
let GITHUB_TOKEN = localStorage.getItem('pms_github_token') || '';
let GITHUB_REPO = localStorage.getItem('pms_github_repo') || '';
let data = { projects: [], tasks: [], nextProjectId: 1, nextTaskId: 1 };
let dataLoaded = false;

function getConfig() { return { token: GITHUB_TOKEN, repo: GITHUB_REPO }; }

function saveConfig(e) {
    e.preventDefault();
    GITHUB_TOKEN = document.getElementById('tokenInput').value.trim();
    GITHUB_REPO = document.getElementById('repoInput').value.trim();
    localStorage.setItem('pms_github_token', GITHUB_TOKEN);
    localStorage.setItem('pms_github_repo', GITHUB_REPO);
    closeModal('tokenModal');
    setStatus('✅ 配置已保存', '');
    loadFromGitHub();
}

function openTokenModal() {
    document.getElementById('tokenInput').value = GITHUB_TOKEN;
    document.getElementById('repoInput').value = GITHUB_REPO;
    document.getElementById('tokenModal').classList.add('active');
}

function setStatus(text, type) {
    const el = document.getElementById('syncStatus');
    el.textContent = text;
    el.className = 'sync-status';
    if (type === 'saving') el.classList.add('saving');
    if (type === 'error') el.classList.add('error');
    if (type === 'loading') el.classList.add('loading');
}

// ============================================================
//  数据操作
// ============================================================
function defaultData() { return { projects: [], tasks: [], nextProjectId: 1, nextTaskId: 1 }; }

function getProjects() { return data ? data.projects : []; }
function getProject(id) { return data ? data.projects.find(p => p.id === id) : null; }
function getTask(id) { return data ? data.tasks.find(t => t.id === id) : null; }
function getChildren(taskId) { return data ? data.tasks.filter(t => t.parentId === taskId && !t.archived) : []; }

function saveLocalCache() { if (data) localStorage.setItem('pms_data_cache', JSON.stringify(data)); }
function loadLocalCache() {
    try { const raw = localStorage.getItem('pms_data_cache'); if (raw) { const d = JSON.parse(raw); d.tasks.forEach(t => { if (t.archived === undefined) t.archived = false; }); return d; } } catch (e) {}
    return null;
}

// ============================================================
//  🔥 核心：通过 GitHub Issues 读写数据
// ============================================================
async function loadFromGitHub() {
    const { token, repo } = getConfig();
    if (!repo) {
        setStatus('⚠️ 请点击「配置」设置仓库', 'error');
        data = loadLocalCache() || defaultData();
        dataLoaded = true;
        renderAll();
        updateStats();
        return;
    }

    try {
        setStatus('📥 从 GitHub 加载...', 'loading');
        const url = `https://api.github.com/repos/${repo}/issues/${STORAGE_ISSUE_NUMBER}`;
        const headers = { 'Accept': 'application/vnd.github.v3+json' };
        if (token) headers['Authorization'] = `token ${token}`;

        const response = await fetch(url, { headers });

        if (response.status === 404) {
            // Issue 不存在，创建
            await createIssue();
            data = defaultData();
            dataLoaded = true;
            saveLocalCache();
            setStatus('📄 新数据已初始化', '');
            renderAll();
            updateStats();
            return;
        }

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const issue = await response.json();
        const body = issue.body || '{}';
        // 尝试解析 JSON
        try {
            const parsed = JSON.parse(body);
            if (parsed.projects !== undefined && parsed.tasks !== undefined) {
                data = parsed;
                data.tasks.forEach(t => { if (t.archived === undefined) t.archived = false; });
                dataLoaded = true;
                saveLocalCache();
                setStatus(`✅ 已同步 (${data.projects.length}个项目, ${data.tasks.length}个任务)`, '');
                renderAll();
                updateStats();
                return;
            }
        } catch (e) {}

        // 如果解析失败，用默认数据
        data = defaultData();
        dataLoaded = true;
        saveLocalCache();
        setStatus('⚠️ 数据格式错误，已重置', 'error');
        renderAll();
        updateStats();
    } catch (err) {
        console.error('加载失败:', err);
        data = loadLocalCache() || defaultData();
        dataLoaded = true;
        setStatus('⚠️ 离线模式', 'error');
        renderAll();
        updateStats();
    }
}

async function createIssue() {
    const { token, repo } = getConfig();
    if (!token || !repo) return;
    try {
        const url = `https://api.github.com/repos/${repo}/issues`;
        await fetch(url, {
            method: 'POST',
            headers: {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                title: '📋 项目管理系统数据存储 (请勿删除)',
                body: JSON.stringify(defaultData(), null, 2),
                labels: ['pms-data']
            })
        });
    } catch (e) { console.error('创建 Issue 失败:', e); }
}

async function syncToGitHub() {
    const { token, repo } = getConfig();
    if (!repo) { alert('请先配置仓库'); openTokenModal(); return; }
    if (!token) { alert('请先配置 Token'); openTokenModal(); return; }
    if (!data) { alert('暂无数据'); return; }

    const jsonContent = JSON.stringify(data, null, 2);

    try {
        setStatus('⏳ 同步中...', 'saving');
        const url = `https://api.github.com/repos/${repo}/issues/${STORAGE_ISSUE_NUMBER}`;

        // 获取当前 Issue 的 etag
        let etag = '';
        try {
            const headRes = await fetch(url, {
                method: 'HEAD',
                headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
            });
            etag = headRes.headers.get('etag') || '';
        } catch (e) {}

        const putRes = await fetch(url, {
            method: 'PATCH',
            headers: {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json',
                'If-Match': etag
            },
            body: JSON.stringify({ body: jsonContent })
        });

        if (!putRes.ok) {
            // 如果更新失败，尝试创建
            if (putRes.status === 404) {
                await createIssue();
                // 重试更新
                const retryRes = await fetch(url, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ body: jsonContent })
                });
                if (!retryRes.ok) throw new Error(`创建后更新失败: ${retryRes.status}`);
            } else {
                throw new Error(`HTTP ${putRes.status}`);
            }
        }

        saveLocalCache();
        setStatus(`✅ 已同步到 GitHub (${new Date().toLocaleTimeString()})`, '');
        alert('✅ 数据已同步到 GitHub Issues！');
    } catch (err) {
        console.error('同步失败:', err);
        setStatus('❌ 同步失败: ' + err.message, 'error');
        alert('❌ 同步失败：' + err.message);
    }
}

}
