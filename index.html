<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人全周期项目管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #f4f6fa;
            --surface: #ffffff;
            --surface-hover: #eef1f6;
            --text: #1a1a2e;
            --text-secondary: #3d3f5e;
            --text-muted: #7a7a9a;
            --border: #dce0e8;
            --primary: #2d4b8c;
            --primary-light: #e6edf8;
            --primary-gradient: linear-gradient(135deg, #2d4b8c, #1f3a6b);
            --shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
            --radius: 14px;
            --radius-sm: 8px;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            --p0: #e74c3c;
            --p1: #e67e22;
            --p2: #f1c40f;
            --p3: #7f8c8d;
        }
        [data-theme="dark"] {
            --bg: #14151c;
            --surface: #1e1f2b;
            --surface-hover: #2a2b3b;
            --text: #edf0f7;
            --text-secondary: #bcc0d0;
            --text-muted: #7a7f96;
            --border: #323446;
            --primary: #6d8fd1;
            --primary-light: #262d44;
            --shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            padding: 16px 20px 40px;
            transition: background 0.2s, color 0.2s;
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        nav {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: var(--surface);
            padding: 12px 24px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            position: sticky;
            top: 12px;
            z-index: 100;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.85);
        }
        [data-theme="dark"] nav {
            background: rgba(30, 31, 43, 0.88);
        }
        .nav-brand {
            font-weight: 700;
            font-size: 1.2rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .nav-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .nav-actions button {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 6px 16px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.15s;
        }
        .nav-actions button:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }
        .github-status {
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 20px;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }
        [data-theme="dark"] .github-status {
            background: #1a3d2a;
            color: #81c784;
            border-color: #2e7d32;
        }
        .github-status.saving {
            background: #fff3e0;
            color: #e65100;
            border-color: #ffcc80;
        }
        .github-status.error {
            background: #ffebee;
            color: #c62828;
            border-color: #ef9a9a;
        }
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
            background: var(--surface);
            padding: 16px 20px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }
        .stats-bar .stat {
            text-align: center;
        }
        .stats-bar .stat .num {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }
        .stats-bar .stat .label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 20px 24px;
            margin-bottom: 20px;
            transition: background 0.2s, border 0.2s;
        }
        .card-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .card-header h2 {
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-header h2 span {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary-gradient);
            color: #fff;
            border: none;
            padding: 7px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 12px rgba(45, 75, 140, 0.2);
        }
        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(45, 75, 140, 0.3);
        }
        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1.5px solid var(--primary);
            box-shadow: none;
        }
        .btn-outline:hover {
            background: var(--primary-light);
        }
        .btn-sm {
            padding: 4px 14px;
            font-size: 0.75rem;
        }
        .btn-danger {
            background: #e74c3c;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.2);
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        .btn-success {
            background: #27ae60;
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.2);
        }
        .btn-success:hover {
            background: #1e8449;
        }
        .btn-github {
            background: #24292e;
            box-shadow: 0 4px 12px rgba(36, 41, 46, 0.2);
        }
        .btn-github:hover {
            background: #1a1e22;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px 16px;
            margin-bottom: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            font-size: 0.88rem;
            color: var(--text);
            transition: 0.15s;
            font-family: var(--font);
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(45, 75, 140, 0.12);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 50px;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .priority-tag {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .priority-p0 {
            background: #fde8e8;
            color: #c0392b;
        }
        .priority-p1 {
            background: #fef3e7;
            color: #d35400;
        }
        .priority-p2 {
            background: #fef9e7;
            color: #b7950b;
        }
        .priority-p3 {
            background: #eef2f5;
            color: #5d6d7e;
        }
        [data-theme="dark"] .priority-p0 {
            background: #3d1a1a;
            color: #f1948a;
        }
        [data-theme="dark"] .priority-p1 {
            background: #3d2a1a;
            color: #f0b27a;
        }
        [data-theme="dark"] .priority-p2 {
            background: #3d3a1a;
            color: #f4d03f;
        }
        [data-theme="dark"] .priority-p3 {
            background: #2a2b33;
            color: #99a3b0;
        }
        .status-tag {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .status-todo {
            background: #eef2f5;
            color: #5d6d7e;
        }
        .status-progress {
            background: #eaf2f8;
            color: #2e86c1;
        }
        .status-review {
            background: #fef9e7;
            color: #b7950b;
        }
        .status-done {
            background: #e9f7ef;
            color: #1e8449;
        }
        .status-blocked {
            background: #fde8e8;
            color: #c0392b;
        }
        [data-theme="dark"] .status-todo {
            background: #2a2b33;
            color: #99a3b0;
        }
        [data-theme="dark"] .status-progress {
            background: #1a2a3d;
            color: #5dade2;
        }
        [data-theme="dark"] .status-review {
            background: #3d3a1a;
            color: #f4d03f;
        }
        [data-theme="dark"] .status-done {
            background: #1a3d2a;
            color: #58d68d;
        }
        [data-theme="dark"] .status-blocked {
            background: #3d1a1a;
            color: #f1948a;
        }
        .task-item {
            border-bottom: 1px solid var(--border);
            padding: 14px 0;
            transition: 0.1s;
        }
        .task-item:last-child {
            border-bottom: none;
        }
        .task-item:hover {
            background: var(--surface-hover);
            margin: 0 -8px;
            padding-left: 8px;
            padding-right: 8px;
            border-radius: var(--radius-sm);
        }
        .task-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 16px;
        }
        .task-row .task-name {
            font-weight: 600;
            flex: 1 1 160px;
            font-size: 0.95rem;
        }
        .task-row .task-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 10px;
            font-size: 0.78rem;
            color: var(--text-secondary);
        }
        .task-row .task-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-left: auto;
        }
        .task-children {
            margin-left: 28px;
            border-left: 2px solid var(--border);
            padding-left: 16px;
            margin-top: 8px;
        }
        .task-sub-toggle {
            cursor: pointer;
            user-select: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            background: none;
            border: none;
            padding: 2px 8px;
            border-radius: 20px;
        }
        .task-sub-toggle:hover {
            background: var(--surface-hover);
        }
        .empty-state {
            text-align: center;
            padding: 30px 10px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 28px 32px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .modal-header h3 {
            font-size: 1.2rem;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }
        .modal-close:hover {
            color: var(--text);
        }
        .token-warning {
            background: #fff3e0;
            border: 1px solid #ffcc80;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 0.85rem;
        }
        [data-theme="dark"] .token-warning {
            background: #2d1f0a;
            border-color: #8d6e3f;
        }
        @media (max-width: 640px) {
            body {
                padding: 10px 12px 30px;
            }
            .card {
                padding: 14px 16px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            nav {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .nav-actions {
                justify-content: center;
            }
            .task-row {
                flex-direction: column;
                align-items: stretch;
            }
            .task-row .task-actions {
                margin-left: 0;
            }
            .task-children {
                margin-left: 12px;
                padding-left: 10px;
            }
            .stats-bar {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media print {
            body {
                background: white;
                padding: 0.2in;
            }
            .card {
                box-shadow: none;
                border: 1px solid #ccc;
                break-inside: avoid;
            }
            nav,
            .nav-actions,
            .btn,
            .task-actions,
            .modal-overlay {
                display: none !important;
            }
            .task-item:hover {
                background: none;
                margin: 0;
                padding: 14px 0;
            }
            .stats-bar {
                border: 1px solid #ccc;
                background: #f8f9fa;
            }
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
        .collapse-enter {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.25s ease, opacity 0.2s ease;
        }
        .collapse-enter.active {
            max-height: 3000px;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <nav>
            <div class="nav-brand">📋 全周期项目事务管理</div>
            <div class="nav-actions">
                <span id="githubStatus" class="github-status">⏳ 加载中...</span>
                <button onclick="saveToGitHub()" class="btn btn-sm btn-github">💾 保存到 GitHub</button>
                <button onclick="switchTheme()">🌓 主题</button>
                <button onclick="window.print()">🖨️ 打印</button>
                <button onclick="openTokenModal()">🔑 配置 Token</button>
            </div>
        </nav>

        <div class="stats-bar" id="statsBar"></div>

        <div class="card">
            <div class="card-header">
                <h2><span>📁 项目总库</span></h2>
                <button class="btn" onclick="openProjectModal()">+ 新建项目</button>
            </div>
            <div id="projectList"></div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2><span>📌 全局任务总库</span></h2>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    <button class="btn btn-sm" onclick="openTaskModal()">+ 新建任务</button>
                    <select id="viewFilter" onchange="renderAll()" style="background:var(--bg);border:1px solid var(--border);border-radius:30px;padding:4px 14px;font-size:0.78rem;color:var(--text);">
                        <option value="all">📊 全部任务</option>
                        <option value="p0">🔴 P0 紧急</option>
                        <option value="p1">🟠 P1 重要</option>
                        <option value="p2">🟡 P2 常规</option>
                        <option value="p3">🔵 P3 次要</option>
                        <option value="todo">⏳ 待规划</option>
                        <option value="progress">🔄 执行中</option>
                        <option value="review">🔍 待复核</option>
                        <option value="done">✅ 已完成</option>
                        <option value="archived">📦 已归档</option>
                    </select>
                </div>
            </div>
            <div id="taskList"></div>
        </div>

        <!-- 项目弹窗 -->
        <div class="modal-overlay" id="projectModal">
            <div class="modal">
                <div class="modal-header">
                    <h3 id="projectModalTitle">新建项目</h3>
                    <button class="modal-close" onclick="closeModal('projectModal')">&times;</button>
                </div>
                <form id="projectForm" onsubmit="saveProject(event)">
                    <input type="hidden" id="projectEditId">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>项目名称 *</label>
                            <input id="pName" required>
                        </div>
                        <div class="form-group">
                            <label>优先级 *</label>
                            <select id="pPriority" required>
                                <option value="P0">P0 最高</option>
                                <option value="P1">P1 重要</option>
                                <option value="P2" selected>P2 常规</option>
                                <option value="P3">P3 次要</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>开始时间 *</label>
                            <input id="pStart" type="datetime-local" required>
                        </div>
                        <div class="form-group">
                            <label>截止时间 *</label>
                            <input id="pEnd" type="datetime-local" required>
                        </div>
                        <div class="form-group">
                            <label>执行场地 *</label>
                            <input id="pLocation" required placeholder="如：学校实验室">
                        </div>
                        <div class="form-group">
                            <label>状态</label>
                            <select id="pStatus">
                                <option value="规划中">规划中</option>
                                <option value="进行迭代" selected>进行迭代</option>
                                <option value="暂停">暂停</option>
                                <option value="收尾完成">收尾完成</option>
                            </select>
                        </div>
                        <div class="form-group" style="grid-column:1/-1;">
                            <label>整体验收标准 *</label>
                            <textarea id="pStandard" required placeholder="如：论文查重率<15%+答辩通过"></textarea>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn">保存</button>
                        <button type="button" class="btn btn-outline" onclick="closeModal('projectModal')">取消</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 任务弹窗 -->
        <div class="modal-overlay" id="taskModal">
            <div class="modal">
                <div class="modal-header">
                    <h3 id="taskModalTitle">新建任务</h3>
                    <button class="modal-close" onclick="closeModal('taskModal')">&times;</button>
                </div>
                <form id="taskForm" onsubmit="saveTask(event)">
                    <input type="hidden" id="taskEditId">
                    <div class="form-grid">
                        <div class="form-group" style="grid-column:1/-1;">
                            <label>任务名称 *</label>
                            <input id="tName" required>
                        </div>
                        <div class="form-group">
                            <label>所属项目（可多选）</label>
                            <select id="tProjects" multiple style="min-height:60px;"></select>
                            <small style="color:var(--text-muted);font-size:0.7rem;">按住 Ctrl/Cmd 多选</small>
                        </div>
                        <div class="form-group">
                            <label>父级任务</label>
                            <select id="tParent"><option value="">无</option></select>
                        </div>
                        <div class="form-group">
                            <label>前置任务</label>
                            <select id="tPrev"><option value="">无</option></select>
                        </div>
                        <div class="form-group">
                            <label>优先级 *</label>
                            <select id="tPriority" required>
                                <option value="P0">P0 最高</option>
                                <option value="P1">P1 重要</option>
                                <option value="P2" selected>P2 常规</option>
                                <option value="P3">P3 次要</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>开始时间 *</label>
                            <input id="tStart" type="datetime-local" required>
                        </div>
                        <div class="form-group">
                            <label>截止时间 *</label>
                            <input id="tEnd" type="datetime-local" required>
                        </div>
                        <div class="form-group">
                            <label>执行场地 *</label>
                            <input id="tLocation" required placeholder="如：图书馆、线上">
                        </div>
                        <div class="form-group">
                            <label>流转状态</label>
                            <select id="tStatus">
                                <option value="待规划">待规划</option>
                                <option value="待启动">待启动</option>
                                <option value="执行中" selected>执行中</option>
                                <option value="待复核">待复核</option>
                                <option value="验收通过">验收通过</option>
                            </select>
                        </div>
                        <div class="form-group" style="grid-column:1/-1;">
                            <label>验收指标 *</label>
                            <textarea id="tAccept" required placeholder="硬性验收标准"></textarea>
                        </div>
                        <div class="form-group" style="grid-column:1/-1;">
                            <label>备注</label>
                            <textarea id="tNote" placeholder="额外说明、场地准入限制等"></textarea>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn">保存</button>
                        <button type="button" class="btn btn-outline" onclick="closeModal('taskModal')">取消</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Token 配置弹窗 -->
        <div class="modal-overlay" id="tokenModal">
            <div class="modal">
                <div class="modal-header">
                    <h3>🔑 配置 GitHub Token</h3>
                    <button class="modal-close" onclick="closeModal('tokenModal')">&times;</button>
                </div>
                <div class="token-warning">
                    ⚠️ Token 只保存在你的浏览器本地，不会上传到任何服务器。
                    需要 <strong>repo</strong> 权限。获取方法：GitHub Settings → Developer settings → Personal access tokens → Generate new token
                </div>
                <form onsubmit="saveToken(event)">
                    <div class="form-group">
                        <label>GitHub Token</label>
                        <input id="tokenInput" type="password" placeholder="输入你的 GitHub Personal Access Token" style="width:100%;">
                    </div>
                    <div class="form-group" style="margin-top:12px;">
                        <label>仓库信息</label>
                        <input id="repoInput" placeholder="用户名/仓库名，如: jiahao-dong/pms-system" style="width:100%;">
                    </div>
                    <div class="form-actions" style="margin-top:16px;">
                        <button type="submit" class="btn">保存</button>
                        <button type="button" class="btn btn-outline" onclick="closeModal('tokenModal')">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  GitHub API 配置
        // ============================================================
        let GITHUB_TOKEN = localStorage.getItem('github_token') || '';
        let GITHUB_REPO = localStorage.getItem('github_repo') || '';
        const GITHUB_PATH = 'data.json';

        function getGitHubConfig() {
            return { token: GITHUB_TOKEN, repo: GITHUB_REPO };
        }

        function saveToken(e) {
            e.preventDefault();
            GITHUB_TOKEN = document.getElementById('tokenInput').value.trim();
            GITHUB_REPO = document.getElementById('repoInput').value.trim();
            localStorage.setItem('github_token', GITHUB_TOKEN);
            localStorage.setItem('github_repo', GITHUB_REPO);
            closeModal('tokenModal');
            updateGitHubStatus('✅ Token 已保存', '');
            fetchData();
        }

        function openTokenModal() {
            document.getElementById('tokenInput').value = GITHUB_TOKEN;
            document.getElementById('repoInput').value = GITHUB_REPO;
            document.getElementById('tokenModal').classList.add('active');
        }

        // ============================================================
        //  数据层
        // ============================================================
        let data = null;
        let dataLoaded = false;

        function defaultData() {
            return {
                projects: [],
                tasks: [],
                nextProjectId: 1,
                nextTaskId: 1
            };
        }

        function loadLocalData() {
            try {
                const raw = localStorage.getItem('pms_data');
                if (raw) {
                    const d = JSON.parse(raw);
                    d.tasks.forEach(t => { if (t.archived === undefined) t.archived = false; });
                    return d;
                }
            } catch (e) {}
            return null;
        }

        function saveLocalData() {
            if (data) {
                localStorage.setItem('pms_data', JSON.stringify(data));
            }
        }

        function updateGitHubStatus(text, type) {
            const el = document.getElementById('githubStatus');
            el.textContent = text;
            el.className = 'github-status';
            if (type === 'saving') el.classList.add('saving');
            if (type === 'error') el.classList.add('error');
        }

        // ============================================================
        //  从 GitHub 加载 data.json
        // ============================================================
        async function fetchData() {
            const { token, repo } = getGitHubConfig();
            if (!repo) {
                updateGitHubStatus('⚠️ 未配置仓库', 'error');
                // 从 localStorage 加载
                data = loadLocalData();
                if (!data) data = defaultData();
                dataLoaded = true;
                renderAll();
                updateStats();
                return;
            }

            try {
                updateGitHubStatus('📥 加载中...', 'saving');
                const url = `https://api.github.com/repos/${repo}/contents/${GITHUB_PATH}`;
                const headers = { 'Accept': 'application/vnd.github.v3+json' };
                if (token) headers['Authorization'] = `token ${token}`;

                const response = await fetch(url, { headers });
                if (response.status === 404) {
                    // data.json 不存在，创建默认数据
                    data = defaultData();
                    dataLoaded = true;
                    saveLocalData();
                    updateGitHubStatus('📄 新数据已初始化，点击保存上传', '');
                    renderAll();
                    updateStats();
                    return;
                }
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const result = await response.json();
                const content = atob(result.content);
                const jsonData = JSON.parse(content);
                jsonData.tasks.forEach(t => { if (t.archived === undefined) t.archived = false; });
                data = jsonData;
                dataLoaded = true;
                saveLocalData();
                updateGitHubStatus(`✅ 已同步 (${data.projects.length}个项目, ${data.tasks.length}个任务)`, '');
                renderAll();
                updateStats();
                checkDeadlines();
            } catch (err) {
                console.error('加载失败:', err);
                // 降级到 localStorage
                data = loadLocalData();
                if (!data) data = defaultData();
                dataLoaded = true;
                saveLocalData();
                updateGitHubStatus('⚠️ 离线模式 (数据存本地)', 'error');
                renderAll();
                updateStats();
            }
        }

        // ============================================================
        //  保存到 GitHub
        // ============================================================
        async function saveToGitHub() {
            const { token, repo } = getGitHubConfig();
            if (!repo) {
                alert('请先点击「配置 Token」按钮，填写仓库信息');
                openTokenModal();
                return;
            }
            if (!token) {
                alert('请先配置 GitHub Token');
                openTokenModal();
                return;
            }

            if (!data) {
                alert('暂无数据可保存');
                return;
            }

            // 确保数据完整
            const jsonContent = JSON.stringify(data, null, 2);
            const encoded = btoa(unescape(encodeURIComponent(jsonContent)));

            try {
                updateGitHubStatus('⏳ 保存中...', 'saving');

                // 先获取文件的 SHA
                const url = `https://api.github.com/repos/${repo}/contents/${GITHUB_PATH}`;
                let sha = null;
                try {
                    const getRes = await fetch(url, {
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });
                    if (getRes.ok) {
                        const result = await getRes.json();
                        sha = result.sha;
                    }
                } catch (e) {}

                // 提交更新
                const body = {
                    message: `更新数据 ${new Date().toLocaleString()}`,
                    content: encoded,
                    branch: 'main'
                };
                if (sha) body.sha = sha;

                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                if (!putRes.ok) {
                    const err = await putRes.json();
                    throw new Error(err.message || `HTTP ${putRes.status}`);
                }

                updateGitHubStatus(`✅ 已保存至 GitHub (${new Date().toLocaleTimeString()})`, '');
                alert('✅ 数据已成功保存到 GitHub！所有访客刷新后将看到最新数据。');
            } catch (err) {
                console.error('保存失败:', err);
                updateGitHubStatus('❌ 保存失败: ' + err.message, 'error');
                alert('❌ 保存失败：' + err.message + '\n\n请检查 Token 权限和仓库名是否正确。');
            }
        }

        // ============================================================
        //  项目 CRUD
        // ============================================================
        function getProjects() { return data ? data.projects : []; }

        function getProject(id) { return data ? data.projects.find(p => p.id === id) : null; }

        function getTasks() { return data ? data.tasks : []; }

        function getTask(id) { return data ? data.tasks.find(t => t.id === id) : null; }

        function getChildren(taskId) {
            return data ? data.tasks.filter(t => t.parentId === taskId && !t.archived) : [];
        }

        function getProjectName(id) {
            const p = getProject(id);
            return p ? p.name : '[已删除]';
        }

        function saveProject(e) {
            e.preventDefault();
            const id = document.getElementById('projectEditId').value;
            const obj = {
                name: document.getElementById('pName').value.trim(),
                priority: document.getElementById('pPriority').value,
                start: document.getElementById('pStart').value,
                end: document.getElementById('pEnd').value,
                location: document.getElementById('pLocation').value.trim(),
                status: document.getElementById('pStatus').value,
                standard: document.getElementById('pStandard').value.trim()
            };
            if (!obj.name || !obj.start || !obj.end || !obj.location || !obj.standard) {
                alert('请填写所有必填字段（带 *）');
                return;
            }
            if (id) {
                const p = getProject(Number(id));
                if (p) Object.assign(p, obj);
            } else {
                obj.id = data.nextProjectId++;
                data.projects.push(obj);
            }
            saveLocalData();
            closeModal('projectModal');
            document.getElementById('projectForm').reset();
            document.getElementById('projectEditId').value = '';
            renderAll();
            updateStats();
            updateGitHubStatus('💡 数据已修改，点击「保存到 GitHub」同步', 'saving');
        }

        function openProjectModal(projectId) {
            const modal = document.getElementById('projectModal');
            document.getElementById('projectForm').reset();
            document.getElementById('projectEditId').value = '';
            document.getElementById('projectModalTitle').textContent = '新建项目';
            if (projectId) {
                const p = getProject(projectId);
                if (!p) return;
                document.getElementById('projectEditId').value = p.id;
                document.getElementById('projectModalTitle').textContent = '编辑项目';
                document.getElementById('pName').value = p.name;
                document.getElementById('pPriority').value = p.priority;
                document.getElementById('pStart').value = p.start;
                document.getElementById('pEnd').value = p.end;
                document.getElementById('pLocation').value = p.location;
                document.getElementById('pStatus').value = p.status;
                document.getElementById('pStandard').value = p.standard;
            }
            modal.classList.add('active');
        }

        function deleteProject(id) {
            if (!confirm('确定删除此项目吗？')) return;
            data.projects = data.projects.filter(p => p.id !== id);
            saveLocalData();
            renderAll();
            updateStats();
            updateGitHubStatus('💡 数据已修改，点击「保存到 GitHub」同步', 'saving');
        }

        // ============================================================
        //  任务 CRUD
        // ============================================================
        function saveTask(e) {
            e.preventDefault();
            const id = document.getElementById('taskEditId').value;
            const projectIds = Array.from(document.getElementById('tProjects').selectedOptions).map(o => Number(o.value));
            const obj = {
                name: document.getElementById('tName').value.trim(),
                projectIds: projectIds,
                parentId: document.getElementById('tParent').value ? Number(document.getElementById('tParent').value) : null,
                prevId: document.getElementById('tPrev').value ? Number(document.getElementById('tPrev').value) : null,
                priority: document.getElementById('tPriority').value,
                start: document.getElementById('tStart').value,
                end: document.getElementById('tEnd').value,
                location: document.getElementById('tLocation').value.trim(),
                status: document.getElementById('tStatus').value,
                accept: document.getElementById('tAccept').value.trim(),
                note: document.getElementById('tNote').value.trim(),
                archived: false
            };
            if (!obj.name || !obj.start || !obj.end || !obj.location || !obj.accept) {
                alert('请填写所有必填字段（带 *）');
                return;
            }
            if (obj.start > obj.end) {
                alert('开始时间不能晚于截止时间');
                return;
            }
            if (obj.prevId) {
                const prev = getTask(obj.prevId);
                if (prev && prev.status !== '验收通过' && prev.status !== '待复核') {
                    if (!confirm('前置任务尚未完成，确定继续吗？')) return;
                }
            }
            if (id) {
                const t = getTask(Number(id));
                if (t) Object.assign(t, obj);
            } else {
                obj.id = data.nextTaskId++;
                data.tasks.push(obj);
            }
            saveLocalData();
            closeModal('taskModal');
            document.getElementById('taskForm').reset();
            document.getElementById('taskEditId').value = '';
            renderAll();
            updateStats();
            updateGitHubStatus('💡 数据已修改，点击「保存到 GitHub」同步', 'saving');
        }

        function openTaskModal(taskId) {
            const modal = document.getElementById('taskModal');
            document.getElementById('taskForm').reset();
            document.getElementById('taskEditId').value = '';
            document.getElementById('taskModalTitle').textContent = '新建任务';
            populateTaskSelects();

            if (taskId) {
                const t = getTask(taskId);
                if (!t) return;
                document.getElementById('taskEditId').value = t.id;
                document.getElementById('taskModalTitle').textContent = '编辑任务';
                document.getElementById('tName').value = t.name;
                Array.from(document.getElementById('tProjects').options).forEach(opt => {
                    opt.selected = t.projectIds && t.projectIds.includes(Number(opt.value));
                });
                if (t.parentId) document.getElementById('tParent').value = t.parentId;
                if (t.prevId) document.getElementById('tPrev').value = t.prevId;
                document.getElementById('tPriority').value = t.priority;
                document.getElementById('tStart').value = t.start;
                document.getElementById('tEnd').value = t.end;
                document.getElementById('tLocation').value = t.location;
                document.getElementById('tStatus').value = t.status;
                document.getElementById('tAccept').value = t.accept;
                document.getElementById('tNote').value = t.note || '';
            }
            modal.classList.add('active');
        }

        function populateTaskSelects() {
            const projSelect = document.getElementById('tProjects');
            projSelect.innerHTML = data ? data.projects.map(p =>
                `<option value="${p.id}">${p.name}</option>`
            ).join('') : '';

            const editId = document.getElementById('taskEditId').value;
            const parentSelect = document.getElementById('tParent');
            parentSelect.innerHTML = '<option value="">无（顶级任务）</option>';
            if (data) {
                data.tasks.filter(t => t.id !== Number(editId) && !t.archived).forEach(t => {
                    parentSelect.innerHTML += `<option value="${t.id}">${t.name}</option>`;
                });
            }

            const prevSelect = document.getElementById('tPrev');
            prevSelect.innerHTML = '<option value="">无</option>';
            if (data) {
                data.tasks.filter(t => t.id !== Number(editId) && !t.archived).forEach(t => {
                    prevSelect.innerHTML += `<option value="${t.id}">${t.name}</option>`;
                });
            }
        }

        function deleteTask(id) {
            if (!confirm('确定删除此任务吗？')) return;
            data.tasks = data.tasks.filter(t => t.id !== id);
            saveLocalData();
            renderAll();
            updateStats();
            updateGitHubStatus('💡 数据已修改，点击「保存到 GitHub」同步', 'saving');
        }

        function toggleArchive(taskId) {
            const t = getTask(taskId);
            if (!t) return;
            if (t.status === '验收通过') {
                t.archived = !t.archived;
                saveLocalData();
                renderAll();
                updateStats();
                updateGitHubStatus('💡 数据已修改，点击「保存到 GitHub」同步', 'saving');
            } else {
                alert('只有「验收通过」的任务才能归档');
            }
        }

        function markDone(taskId) {
            const t = getTask(taskId);
            if (!t) return;
            if (t.status === '验收通过') {
                alert('该任务已验收通过');
                return;
            }
            if (t.prevId) {
                const prev = getTask(t.prevId);
                if (prev && prev.status !== '验收通过') {
                    alert('前置任务尚未验收通过，请先完成前置任务');
                    return;
                }
            }
            if (!t.accept || t.accept.trim() === '') {
                alert('请填写验收指标后再标记完成');
                return;
            }
            t.status = '待复核';
            saveLocalData();
            renderAll();
            updateStats();
            updateGitHubStatus('💡 数据已修改，点击「保存到 GitHub」同步', 'saving');
        }

        function approveTask(taskId) {
            const t = getTask(taskId);
            if (!t) return;
            if (t.status !== '待复核') {
                alert('只有「待复核」状态的任务才能验收通过');
                return;
            }
            t.status = '验收通过';
            saveLocalData();
            renderAll();
            updateStats();
            updateGitHubStatus('💡 数据已修改，点击「保存到 GitHub」同步', 'saving');
        }

        // ============================================================
        //  渲染引擎
        // ============================================================
        function renderAll() {
            if (!data) return;
            renderProjects();
            renderTasks();
        }

        function renderProjects() {
            const container = document.getElementById('projectList');
            if (data.projects.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无项目，点击「新建项目」开始</div>';
                return;
            }
            container.innerHTML = data.projects.map(p => `
                <div class="task-item">
                    <div class="task-row">
                        <span class="task-name">${p.name}</span>
                        <span class="priority-tag priority-${p.priority.toLowerCase()}">${p.priority}</span>
                        <span class="status-tag status-${p.status === '收尾完成' ? 'done' : p.status === '暂停' ? 'blocked' : 'progress'}">${p.status}</span>
                        <span class="task-meta">📅 ${p.start} ~ ${p.end}</span>
                        <span class="task-meta">📍 ${p.location}</span>
                        <div class="task-actions">
                            <button class="btn btn-sm btn-outline" onclick="openProjectModal(${p.id})">✎</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteProject(${p.id})">✕</button>
                        </div>
                    </div>
                    <div style="font-size:0.8rem;color:var(--text-secondary);margin-top:4px;">✅ ${p.standard}</div>
                </div>
            `).join('');
        }

        function renderTasks() {
            const container = document.getElementById('taskList');
            const filter = document.getElementById('viewFilter').value;

            let tasks = data.tasks.filter(t => !t.archived);
            if (filter === 'p0') tasks = tasks.filter(t => t.priority === 'P0');
            else if (filter === 'p1') tasks = tasks.filter(t => t.priority === 'P1');
            else if (filter === 'p2') tasks = tasks.filter(t => t.priority === 'P2');
            else if (filter === 'p3') tasks = tasks.filter(t => t.priority === 'P3');
            else if (filter === 'todo') tasks = tasks.filter(t => t.status === '待规划' || t.status === '待启动');
            else if (filter === 'progress') tasks = tasks.filter(t => t.status === '执行中');
            else if (filter === 'review') tasks = tasks.filter(t => t.status === '待复核');
            else if (filter === 'done') tasks = tasks.filter(t => t.status === '验收通过' && !t.archived);
            else if (filter === 'archived') {
                tasks = data.tasks.filter(t => t.archived);
                if (tasks.length === 0) {
                    container.innerHTML = '<div class="empty-state">📦 暂无已归档任务</div>';
                    return;
                }
                container.innerHTML = tasks.map(t => renderTaskItem(t, true)).join('');
                return;
            }

            const topTasks = tasks.filter(t => t.parentId === null || t.parentId === undefined);
            if (topTasks.length === 0 && tasks.length > 0) {
                container.innerHTML = tasks.map(t => renderTaskItem(t, false)).join('');
                return;
            }
            container.innerHTML = topTasks.map(t => renderTaskItem(t, false)).join('');
        }

        function renderTaskItem(task, isArchived) {
            const children = getChildren(task.id);
            const hasChildren = children.length > 0;
            const statusClass = task.status === '验收通过' ? 'done' :
                task.status === '待复核' ? 'review' :
                task.status === '执行中' ? 'progress' :
                task.status === '待规划' || task.status === '待启动' ? 'todo' : 'blocked';

            let isBlocked = false;
            if (task.prevId) {
                const prev = getTask(task.prevId);
                if (prev && prev.status !== '验收通过') isBlocked = true;
            }
            const displayStatus = isBlocked ? '阻塞' : task.status;

            const projectTags = (task.projectIds || []).map(id => {
                const p = getProject(id);
                return p ? `<span style="background:var(--primary-light);padding:1px 10px;border-radius:20px;font-size:0.7rem;color:var(--primary);">${p.name}</span>` :
                    '';
            }).join('');

            return `
                <div class="task-item">
                    <div class="task-row">
                        <span class="task-name">${task.name}</span>
                        <span class="priority-tag priority-${task.priority.toLowerCase()}">${task.priority}</span>
                        <span class="status-tag status-${isBlocked ? 'blocked' : statusClass}">${displayStatus}</span>
                        ${projectTags ? `<span class="task-meta">${projectTags}</span>` : ''}
                        <span class="task-meta">📅 ${task.start} ~ ${task.end}</span>
                        <span class="task-meta">📍 ${task.location}</span>
                        ${task.prevId ? `<span class="task-meta">⬅️ 依赖 #${task.prevId}</span>` : ''}
                        <div class="task-actions">
                            ${!isArchived ? `
                                <button class="btn btn-sm btn-outline" onclick="openTaskModal(${task.id})">✎</button>
                                <button class="btn btn-sm btn-success" onclick="markDone(${task.id})">✔</button>
                                ${task.status === '待复核' ? `<button class="btn btn-sm" onclick="approveTask(${task.id})">✅ 验收</button>` : ''}
                                <button class="btn btn-sm btn-outline" onclick="toggleArchive(${task.id})">📦</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteTask(${task.id})">✕</button>
                            ` : `
                                <button class="btn btn-sm btn-outline" onclick="toggleArchive(${task.id})">↩️ 取消归档</button>
                            `}
                            ${hasChildren ? `<button class="task-sub-toggle" onclick="toggleChildren(this)">▼ ${children.length}个子任务</button>` : ''}
                        </div>
                    </div>
                    <div style="font-size:0.8rem;color:var(--text-secondary);margin-top:2px;">✅ ${task.accept}</div>
                    ${task.note ? `<div style="font-size:0.75rem;color:var(--text-muted);">📝 ${task.note}</div>` : ''}
                    ${hasChildren ? `
                        <div class="task-children collapse-enter active">
                            ${children.map(c => renderTaskItem(c, isArchived)).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function toggleChildren(btn) {
            const parent = btn.closest('.task-item');
            const children = parent.querySelector('.task-children');
            if (children) {
                children.classList.toggle('active');
                btn.textContent = children.classList.contains('active') ?
                    `▼ ${children.querySelectorAll('.task-item').length}个子任务` :
                    `▶ ${children.querySelectorAll('.task-item').length}个子任务`;
            }
        }

        // ============================================================
        //  统计
        // ============================================================
        function updateStats() {
            if (!data) return;
            const total = data.tasks.filter(t => !t.archived).length;
            const done = data.tasks.filter(t => t.status === '验收通过' && !t.archived).length;
            const p0 = data.tasks.filter(t => t.priority === 'P0' && !t.archived).length;
            const archived = data.tasks.filter(t => t.archived).length;
            document.getElementById('statsBar').innerHTML = `
                <div class="stat"><div class="num">${data.projects.length}</div><div class="label">📁 项目</div></div>
                <div class="stat"><div class="num">${total}</div><div class="label">📌 进行中</div></div>
                <div class="stat"><div class="num">${done}</div><div class="label">✅ 已完成</div></div>
                <div class="stat"><div class="num">${p0}</div><div class="label">🔴 P0 紧急</div></div>
                <div class="stat"><div class="num">${archived}</div><div class="label">📦 已归档</div></div>
            `;
        }

        // ============================================================
        //  工具函数
        // ============================================================
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
        document.querySelectorAll('.modal-overlay').forEach(el => {
            el.addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });
        });

        function switchTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            html.setAttribute('data-theme', current === 'dark' ? '' : 'dark');
            localStorage.setItem('theme', html.getAttribute('data-theme') || '');
        }
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme) document.documentElement.setAttribute('data-theme', theme);
        })();

        function checkDeadlines() {
            if (!data) return;
            const now = new Date();
            const overdue = data.tasks.filter(t => {
                if (t.archived || t.status === '验收通过') return false;
                return new Date(t.end) < now;
            });
            if (overdue.length > 0) {
                setTimeout(() => {
                    const names = overdue.map(t => t.name).join('、');
                    if (confirm(`⚠️ 有 ${overdue.length} 个任务已逾期：\n${names}\n\n立即查看？`)) {
                        document.getElementById('viewFilter').value = 'progress';
                        renderAll();
                    }
                }, 500);
            }
        }

        // ============================================================
        //  启动
        // ============================================================
        // 先检查是否有 token/repo 配置
        if (GITHUB_REPO) {
            fetchData();
        } else {
            updateGitHubStatus('⚠️ 请先配置 GitHub', 'error');
            data = loadLocalData();
            if (!data) data = defaultData();
            dataLoaded = true;
            renderAll();
            updateStats();
        }
    </script>
</body>
</html>
